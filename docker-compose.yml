
services:
  task-manager-postgres:
    image: postgres:18.6-bookworm
    container_name: task-manager-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./out/pgdata:/var/lib/postgresql
    restart: always

  task-manager-migrate:
    image: migrate/migrate:v4.20.1
    volumes: 
      - ./migrations:/migrations
    depends_on:
      - task-manager-postgres

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: task-manager-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:task-manager-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"